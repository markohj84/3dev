  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  --ink-800: #0c1f1a;\n  --ink-700: #1a3329;\n  --ink-600: #2a4a3e;\n  --ink-500: #4a665e;\n  --ink-400: #95a8a0;\n\n  /* jade — acento */\n  --jade-900: #04342c;\n  --jade-800: #085041;\n  --jade-700: #1d9e75;\n  --jade-600: #5dc4a4;\n  --jade-400: #9fe1cb;\n  --jade-100: #e1f5ee;\n\n  /* cream — texto sobre dark, superficies en light */\n  --cream-700: #b5a995;\n  --cream-500: #d8d1c2;\n  --cream-300: #f0ebe1;\n  --cream-200: #f6f3eb;\n  --cream-100: #fdfbf7;\n  --cream-50:  #ffffff;\n\n  /* status — semánticos universales */\n  --status-success: #1d9e75;\n  --status-danger:  #e24b4a;\n  --status-warning: #ef9f27;\n  --status-info:    #5dc4a4;\n\n  /* ============================================================\n   * 2. SEMANTIC TOKENS — DARK MODE (default)\n   * These are what your components consume.\n   * ============================================================ */\n\n  --surface-bg:        var(--ink-800);\n  --surface-elev:      var(--ink-700);\n  --surface-overlay:   var(--ink-900);\n\n  --text-primary:      var(--cream-300);\n  --text-secondary:    var(--ink-400);\n  --text-tertiary:     var(--ink-500);\n  --text-inverse:      var(--ink-900);\n  --text-on-accent:    var(--jade-900);\n\n  --accent-default:    var(--jade-600);\n  --accent-strong:     var(--jade-700);\n  --accent-subtle:     var(--ink-700);\n\n  --border-sub:        var(--ink-700);\n  --border-default:    var(--ink-600);\n  --border-strong:     var(--ink-500);\n  --border-accent:     var(--jade-600);\n\n  /* ============================================================\n   * 3. TYPOGRAPHY\n   * ============================================================ */\n\n  --font-sans: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* display — para titulares y hero */\n  --text-display-xl-size:   48px;\n  --text-display-xl-line:   52px;\n  --text-display-xl-track:  -2px;\n  --text-display-xl-weight: 600;\n\n  --text-display-lg-size:   36px;\n  --text-display-lg-line:   40px;\n  --text-display-lg-track:  -1.2px;\n  --text-display-lg-weight: 600;\n\n  --text-display-md-size:   24px;\n  --text-display-md-line:   30px;\n  --text-display-md-track:  -0.6px;\n  --text-display-md-weight: 600;\n\n  /* body — texto corrido */\n  --text-body-lg-size: 17px;\n  --text-body-lg-line: 27px;\n\n  --text-body-size:    15px;\n  --text-body-line:    25px;\n\n  --text-body-sm-size: 13px;\n  --text-body-sm-line: 20px;\n\n  /* mono — gestos técnicos, eyebrows, labels */\n  --text-mono-md-size:  13px;\n  --text-mono-md-line:  20px;\n  --text-mono-md-track: 0.3px;\n\n  --text-mono-sm-size:   11px;\n  --text-mono-sm-line:   15px;\n  --text-mono-sm-track:  1px;\n  --text-mono-sm-weight: 500;\n\n  /* ============================================================\n   * 4. SPACING (base 4)\n   * ============================================================ */\n\n  --s-1:   4px;\n  --s-2:   8px;\n  --s-3:  12px;\n  --s-4:  16px;\n  --s-5:  20px;\n  --s-6:  24px;\n  --s-8:  32px;\n  --s-10: 40px;\n  --s-12: 48px;\n  --s-16: 64px;\n  --s-20: 80px;\n  --s-24: 96px;\n  --s-32: 128px;\n  --s-40: 160px;\n\n  /* ============================================================\n   * 5. RADIUS — restringido por sistema\n   * El máximo es 8px excepto pills. Mantener esta restricción.\n   * ============================================================ */\n\n  --r-xs:   2px;\n  --r-sm:   4px;\n  --r-md:   6px;\n  --r-lg:   8px;\n  --r-full: 9999px;\n\n  /* ============================================================\n   * 6. BORDER WIDTHS\n   * ============================================================ */\n\n  --border-hairline: 0.5px;\n  --border-thin:     1px;\n  --border-thick:    2px;\n\n  /* ============================================================\n   * 7. MOTION\n   * ============================================================ */\n\n  --m-fast: 120ms;\n  --m-base: 240ms;\n  --m-slow: 400ms;\n  --m-hero: 800ms /* ============================================================\n * UTILITY CLASSES — opt-in shortcuts\n * Use these or write your own. They are not required.\n * ============================================================ */\n\n.text-display-xl {\n  font-size: var(--text-display-xl-size);\n  line-height: calc(var(--text-display-xl-line) / var(--text-display-xl-size));\n  letter-spacing: var(--text-display-xl-track);\n  font-weight: var(--text-display-xl-weight);\n}\n\n.text-display-lg {\n  font-size: var(--text-display-lg-size);\n  line-height: calc(var(--text-display-lg-line) / var(--text-display-lg-size));\n  letter-spacing: var(--text-display-lg-track);\n  font-weight: var(--text-display-lg-weight);\n}\n\n.text-display-md {\n  font-size: var(--text-display-md-size);\n  line-height: calc(var(--text-display-md-line) / var(--text-display-md-size));\n  letter-spacing: var(--text-display-md-track);\n  font-weight: var(--text-display-md-weight);\n}\n\n.text-body-lg {\n  font-size: var(--text-body-lg-size);\n  line-height: calc(var(--text-body-lg-line) / var(--text-body-lg-size));\n}\n\n.text-body {\n  font-size: var(--text-body-size);\n  line-height: calc(var(--text-body-line) / var(--text-body-size));\n}\n\n.text-body-sm {\n  font-size: var(--text-body-sm-size);\n  line-height: calc(var(--text-body-sm-line) / var(--text-body-sm-size));\n}\n\n.text-mono-md {\n  font-family: var(--font-mono);\n  font-size: var(--text-mono-md-size);\n  line-height: calc(var(--text-mono-md-line) / var(--text-mono-md-size));\n  letter-spacing: var(--text-mono-md-track);\n}\n\n.text-mono-sm {\n  font-family: var(--font-mono);\n  font-size: var(--text-mono-sm-size);\n  line-height: calc(var(--text-mono-sm-line) / var(--text-mono-sm-size));\n  letter-spacing: var(--text-mono-sm-track);\n  font-weight: var(--text-mono-sm-weight);\n  text-transform: uppercase;\n}\n\n.font-mono { font-family: var(--font-mono); }\n.font-sans { font-family: var(--font-sans); }\n<\u002Fstyle>\n<script src=\"aeb46 02Fspan><span>Servicios<\u002Fspan><span>Contacto<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <span style=\"font-size:clamp(20px,2.2vw,28px);font-weight:600;letter-spacing:-0.04em;line-height:1.05\">Lo que haces, presentado como merece.<\u002Fspan>\n                <span style=\"display:flex;gap:6px\"><span style=\"font-size:10px;background:var(--jade-700);color:var(--cream-50);padding:6px 9px;border-radius:4px\">WhatsApp<\u002Fspan><span style=\"font-size:10px;border:0.5px solid var(--cream-700);padding:6px 9px;border-radius:4px\">Ubicación<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"aspect-ratio:4/3;background:var(--cream-500);border-radius:6px;display:flex;align-items:flex-end;padding:8px\"><span style=\"font-family:var(--font-mono);font-size:9px;color:var(--ink-600)\">tu foto aquí<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px\"><span style=\"height:46px;background:var(--cream-300);border-radius:4px\"><\u002Fspan><span style=\"height:46px;background:var(--cream-300);border-radius:4px\"><\u002Fspan><span style=\"height:46px;background:var(--cream-300);border-radius:4px\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:absolute;right:-12px;bottom:0;width:132px;height:250px;border:7px solid var(--ink-900);outline:0.5px solid var(--border-strong);border-radius:24px;background:var(--cream-200);overflow:hidden;color:var(--ink-800);padding:20px 12px;display:flex;flex-direction:column;gap:10px\">\n            <b style=\"font-size:10px;font-weight:600\">Tu negocio<\u002Fb>\n            <span style=\"font-size:14px;font-weight:600;letter-spacing:-0.    <\u002Fdiv>\n        <\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;left:{{ revealPct }};width:2px;margin-left:-1px;background:var(--accent-default);pointer-events:none\">\n          <span style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:9999px;background:var(--accent-default);color:var(--text-on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px\">⇆<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ reveal }}\" sc-camel-on-input=\"{{ onReveal }}\" sc-camel-on-change=\"{{ onReveal }}\" aria-label=\"Comparar presencia básica y sitio profesional\" style=\"position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;touch-action:pan-y\">\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)\"><span>← presencia básica<\u002Fspan><span>sitio profesional →<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 SOLUCIONES INTRO -->\n<section id=\"soluciones\" data-scene=\"soluciones\" style=\"padding:clamp(96px,14vh,160px) 24px 72px;background:var(--surface-overlay);border-top:0.5px solid var(--border-sub);scroll-snap-align:start\">\n  <div style=\"max-width:var(--max-w-page);margin:0 auto;display:flex;flex-direction:column;gap:56px\">\n    <div data-reveal=\"0\" style=\"display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:1.4px;color:var(--accent-default)\">04 / tres formas de crecer<\u002Fspan>\n      <h2 style=\"margin:0;font-weight:600;font-size:clamp(34px,4.8vw,72px);line-height:1.02;letter-spacing:-0.04em;max-width:16ch;text-wrap:balance\">Una solución para cada etapa de tu negocio.<\u002Fh2>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;color:var(--text-secondary);max-width:52ch\">Precio, alcance y tiempo de entrega cerrados. Pago único por el sitio, con hospedaje y dominio incluidos el primer año.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));border-top:0.5px solid var(--border-default)\">\n      <sc-for list=\"{{ packages }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <a href=\"{{ p.hash }}\" sc-camel-on-click=\"{{ p.go }}\" data-reveal=\"{{ p.revealIdx }}\" style=\"display:flex;flex-direction:column;gap:14px;padding:28px 28px 28px 0;color:var(--text-primary);border-bottom:0.5px solid var(--border-sub);transition:color 120ms\" style-hover=\"color:var(--accent-default)\">\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)\">{{ p.index }} / {{ p.slug }}<\u002Fspan>\n          <span style=\"font-size:clamp(26px,2.4vw,34px);font-weight:600;letter-spacing:-0.03em\">{{ p.name }}<\u002Fspan>\n          <span style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\"><span style=\"font-family:var(--font-mono);font-size:20px\">{{ p.priceLabel }} <span style=\"font-size:12px;color:var(--text-secondary)\">MXN<\u002Fspan><\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)\">ver paquete ↓<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PACKAGE SHOWCASE -->\n<sc-for list=\"{{ packages }}\" as=\"pkg\" hint-placeholder-count=\"3\">\n<section id=\"{{ pkg.id }}\" data-scene=\"{{ pkg.id }}\" data-theme=\"{{ pkg.theme }}\" style=\"min-height:{{ sceneMinH }};padding:clamp(88px,12vh,140px) 24px;background:{{ pkg.surface }};color:var(--text-primary);border-top:0.5px solid var(--border-sub);scroll-snap-align:start;display:flex;align-items:center\">\n  <div style=\"max-width:var(--max-w-page);margin:0 auto;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:64px;align-items:center\">\n    <div data-reveal=\"0\" style=\"display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:1.4px;color:var(--accent-default)\">{{ pkg.index }} / {{ pkg.slug }}<\u002Fspan>\n        <h3 style=\"margin:0;font-weight:600;font-size:clamp(40px,5vw,76px);line-height:0.98;letter-spacing:-0.045em\">{{ pkg.name }}<\u002Fh3>\n        <p style=\"margin:0;font-size:clamp(19px,1.6vw,23px);line-height:1.4;letter-spacing:-0.01em;max-width:30ch;text-wrap:pretty\">{{ pkg.concept }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;padding:22px 0;border-top:0.5px solid var(--border-default);border-bottom:0.5px solid var(--border-default)\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--text-secondary)\">PRECIO · PAGO ÚNICO<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:clamp(36px,3.6vw,52px);font-weight:500;letter-spacing:-0.04em;line-height:1\">{{ pkg.priceLabel }} <span style=\"font-size:16px;letter-spacing:0;color:var(--text-secondary)\">MXN<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--text-secondary)\">ENTREGA<\u002Fspan>\n          <span style=\"font-size:20px;font-weight:500\">{{ pkg.delivery }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--text-secondary);max-width:48ch\">{{ pkg.description }}<\u002Fp>\n      <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px\">\n        <sc-for list=\"{{ pkg.features }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <li style=\"display:flex;gap:12px;align-items:baseline;font-size:15px;line-height:1.45\"><span aria-hidden=\"true\" style=\"flex:none;width:6px;height:6px;border-radius:1px;background:var(--accent-default);transform:translateY(-2px)\"><\u002Fspan><span>{{ f }}<\u002Fspan><\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n      <sc-if value=\"{{ pkg.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:14px;padding:16px 18px;border:0.5px solid var(--border-strong);border-radius:var(--r-md);font-size:14px;line-height:1.5\">\n          <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--accent-default);flex:none;padding-top:2px\">IMPORTANTE<\u002Fspan>\n          <span>{{ pkg.note }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ pkg.choose }}\" style=\"font-family:var(--font-mono);font-size:14px;font-weight:500;background:var(--accent-default);color:var(--text-on-accent);padding:16px 22px;border:0;border-radius:var(--r-sm);cursor:pointer;display:flex;gap:10px;align-items:center;transition:background 120ms\" style-hover=\"background:var(--jade-400)\" style-active=\"transform:scale(0.98)\">{{ pkg.cta }} <span aria-hidden=\"true\">→<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ pkg.hasDemo }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"{{ pkg.demoUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--text-primary);padding:16px 22px;border-radius:var(--r-sm);border:0.5px solid var(--border-strong);display:flex;gap:10px;align-items:center;transition:border-color 120ms\" style-hover=\"border-color:var(--accent-default);color:var(--text-primary)\">Abrir demo real <span aria-hidden=\"true\">↗<\u002Fspan><\u002Fa>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ goComparar }}\" style=\"font-family:var(--font-mono);font-size:14px;color:var(--text-secondary);padding:16px 8px;border:0;background:transparent;cursor:pointer;transition:color 120ms\" style-hover=\"color:var(--text-primary)\">Comparar paquetes<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:16px;align-items:center;min-width:0\">\n      <div style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n        <span style=\"display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)\"><span style=\"width:7px;height:7px;border-radius:9999px;background:{{ pkg.statusColor }}\"><\u002Fspan>{{ pkg.statusLabel }}<\u002Fspan>\n        <div role=\"group\" aria-label=\"Vista del demo\" style=\"display:flex;padding:3px;border:0.5px solid var(--border-default);border-radius:var(--r-sm)\">\n          <button sc-camel-on-click=\"{{ pkg.setDesktop }}\" aria-pressed=\"{{ pkg.isDesktop }}\" style=\"font-family:var(--font-mono);font-size:12px;padding:8px 14px;border:0;border-radius:2px;cursor:pointer;background:{{ pkg.deskBg }};color:{{ pkg.deskFg }};transition:all 120ms\">Escritorio<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ pkg.setMobile }}\" aria-pressed=\"{{ pkg.isMobile }}\" style=\"font-family:var(--font-mono);font-size:12px;padding:8px 14px;border:0;border-radius:2px;cursor:pointer;background:{{ pkg.mobBg }};color:{{ pkg.mobFg }};transition:all 120ms\">Celular<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:100%;max-width:{{ pkg.frameMaxW }};height:{{ pkg.frameH }};border:{{ pkg.frameBorder }};outline:0.5px solid var(--border-strong);border-radius:{{ pkg.frameR }};overflow:hidden;background:var(--ink-900);display:flex;flex-direction:column;transition:ma -800)\">servicios<\u002Fspan>\n                  <span style=\"font-size:clamp(22px,2.6vw,32px);font-weight:600;letter-spacing:-0.04em;line-height:1.05\">Cada servicio, con su espacio.<\u002Fspan>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\">\n                    <sc-for list=\"{{ cServices }}\" as=\"sv\" hint-placeholder-count=\"4\">\n                      <div style=\"border:0.5px solid var(--cream-500);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:var(--font-mono);font-size:10px;color:var(--jade-800)\">{{ sv.n }}<\u002Fspan><b style=\"font-size:14px;font-weight:600\">{{ sv.t }}<\u002Fb><span style=\"font-size:12px;color:var(--ink-600)\">Descripción breve del servicio.<\u002Fspan><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ c3 }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:28px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px\">\n                  <div style=\"display:flex;flex-direction:column;gap:10px\">\n                    <span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--jade-800)\">contacto<\u002Fspan>\n                    <span style=\"font-size:24px;font-weight:600;letter-spacing:-0.04em\">Escríbenos.<\u002Fspan>\n                    <span style=\"height:32px;border:0.5px solid var(--cream-700);border-radius:4px;font-size:11px;padding:8px;color:var(--ink-500)\">Nombre<\u002Fspan>\n                    <span style=\"height:32px;border:0.5px solid var(--cream-700);border-radius:4px;font-size:11px;padding:8px;color:var(--ink-500)\">Correo<\u002Fspan>\n                    <span style=\"height:64px;border:0.5px solid var(--cream-700);border-radius:4px;font-size:11px;padding:8px;color:var(--ink-500)\">Mensaje<\u0 n    <div data-reveal=\"0\" style=\"display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:1.4px;color:var(--accent-default)\">05 / comparar<\u002Fspan>\n      <h2 style=\"margin:0;font-weight:600;font-size:clamp(34px,4.4vw,64px);line-height:1.02;letter-spacing:-0.04em;max-width:18ch;text-wrap:balance\">¿Cuál es el paquete para tu negocio?<\u002Fh2>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)\">elige la frase que más se parece a lo que necesitas<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px\">\n        <sc-for list=\"{{ needs }}\" as=\"n\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ n.pick }}\" aria-pressed=\"{{ n.active }}\" style=\"text-align:left;cursor:pointer;padding:22px;border-radius:var(--r-lg);border:0.5px solid {{ n.border }};background:{{ n.bg }};color:var(--text-primary);display:flex;flex-direction:column;gap:14px;transition:border-color 120ms,background 240ms,transform 240ms var(--curve-out)\" style-hover=\"border-color:var(--accent-default);transform:translateY(-2px)\">\n            <span style=\"font-size:20px;font-weight:500;letter-spacing:-0.02em;line-height:1.3\">“{{ n.q }}”<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:12px;color:{{ n.fg }}\">→ {{ n.pkgName }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"2\" style=\"display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-bottom:0.5px solid var(--border-default);position:sticky;top:64px;background:var(--surface-overlay);z-index:2\">\n        <sc-for list=\"{{ compareHead }}\" as=\"h\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ h.pick }}\" style=\"text-align:left;cursor:pointer;border:0;background:{{ h.bg }};color:var(--text-primary);padding:18px 14px;display:flex;flex-direction:column;gap:6px;border-top:2px solid {{ h.line }};transition:background 240ms\">\n            <span style=\"font-size:clamp(15px,1.6vw,22px);font-weight:600;letter-spacing:-0.02em\">{{ h.name }}<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:clamp(12px,1.2vw,15px);color:var(--text-secondary)\">{{ h.priceLabel }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ compareRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"border-bottom:0.5px solid var(--border-sub)\">\n          <div style=\"padding:16px 14px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--text-secondary)\">{{ r.label }}<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr))\">\n            <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"padding:6px 14px 16px;font-size:clamp(14px,1.3vw,17px);line-height:1.4;background:{{ c.bg }};color:{{ c.fg }};transition:background 240ms\">{{ c.v }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding:22px 14px 0;display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--text-secondary)\">INCLUIDO EN LOS TRES<\u002Fspan>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ common }}\" as=\"cm\" hint-placeholder-count=\"6\">\n            <span style=\"font-family:var(--font-mono);font-size:12px;padding:7px 11px;border-radius:var(--r-sm);background:color-mix(in srgb, var(--accent-default) 12%, transparent);color:var(--jade-400)\">{{ cm }}<\u00
